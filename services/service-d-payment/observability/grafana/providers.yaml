apiVersion: 1
providers:
  # Preserve the original provider and its dashboards.
  - name: Default
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
  - name: Service D Payment
    orgId: 1
    folder: Service D
    type: file
    disableDeletion: false
    editable: false
    options:
      path: /var/lib/grafana/dashboards-service-d
