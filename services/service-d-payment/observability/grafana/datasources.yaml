apiVersion: 1
# Reuse the existing names; do not create extra datasources or replace their UIDs.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: ${SERVICE_D_LOKI_UID}
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{job="service-d-payment"} | json | trace_id="$${__trace.traceId}"'
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: PaymentUnifiedView
          matcherRegex: '"trace_id"\s*:\s*"([0-9a-f]{32})"'
          url: '/d/cloudstore-service-d?var-trace_id=$${__value.raw}&from=now-1h&to=now'
          urlDisplayLabel: 'Vue unifiée de ce paiement'
        - name: JaegerTrace
          matcherRegex: '"trace_id"\s*:\s*"([0-9a-f]{32})"'
          url: 'http://localhost:16686/trace/$${__value.raw}'
          urlDisplayLabel: 'Trace Jaeger exacte'
